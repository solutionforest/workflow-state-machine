name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv

    - name: Install Composer dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader --no-dev

    - name: Run tests
      run: |
        composer install --dev
        vendor/bin/pest
        vendor/bin/pint --test
        vendor/bin/phpstan analyse --memory-limit=256M

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## What's Changed
          
          Please check the [CHANGELOG.md](CHANGELOG.md) for detailed information about this release.
          
          ## Installation
          
          ```bash
          composer require solution-forest/workflow-state-machine:${{ github.ref_name }}
          ```
          
          ## Full Changelog
          
          See all changes at: https://github.com/solution-forest/workflow-state-machine/compare/...${GITHUB_REF#refs/tags/}
        draft: false
        prerelease: false
